name: CI/CD Pipeline

on:
    push:
        branches: [main, develop]
    pull_request:
        branches: [main]

env:
    # Define IMAGE_REPO globalmente
    IMAGE_REPO: ghcr.io/${{ github.repository_owner }}
    IMAGE_NAME: meu-software-customizado-frontend

jobs:
    build-and-push:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Login to Container Registry
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Build and Push Docker Image
              uses: docker/build-push-action@v5
              with:
                  context: .
                  push: true
                  tags: |
                      ${{ env.IMAGE_REPO }}/${{ env.IMAGE_NAME }}:latest
                      ${{ env.IMAGE_REPO }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
            - name: Verify Docker Image
              run: |
                  docker images | grep ${env.IMAGE_NAME}
            - name: Cleanup Docker Images
              run: docker system prune -f
            - name: Confirm Cleanup
              run: docker images | grep ${env.IMAGE_NAME} || echo "Image successfully removed"
