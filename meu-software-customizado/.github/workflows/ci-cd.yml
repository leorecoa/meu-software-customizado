name: CI/CD Pipeline

on:
    push:
        branches: ["main"]
    pull_request:
        branches: ["main"]

jobs:
    test:
        name: Rodar Testes (Vitest)
        runs-on: ubuntu-latest
        steps:
            - name: Checkout do código
              uses: actions/checkout@v4

            - name: Configurar Node.js 22
              uses: actions/setup-node@v4
              with:
                  node-version: "22"
                  cache: "npm"

            - name: Instalar dependências
              run: npm install

            - name: Executar Testes
              run: npm run test

    build-and-push:
        name: Build Docker & Push to GHCR
        needs: test
        if: github.ref == 'refs/heads/main'
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write
        steps:
            - name: Checkout do código
              uses: actions/checkout@v4

            - name: Login no GitHub Container Registry
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            # Garante que o nome do repositório esteja em minúsculas para o Docker
            - name: Definir nome da imagem em minúsculas
              run: |
                  echo "IMAGE_REPO=${GITHUB_REPOSITORY,,}" >>${GITHUB_ENV}

            - name: Build e Push da Imagem
              uses: docker/build-push-action@v5
              with:
                  context: .
                  # Aqui está o segredo: push: true envia a imagem para o registro
                  push: true
                  tags: ghcr.io/${{ env.IMAGE_REPO }}/frontend:latest
