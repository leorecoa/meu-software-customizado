name: Docker Image CI

on:
    push:
        branches: ["main"]
    pull_request:
        branches: ["main"]

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - name: Build Docker image
              run: docker build -t meu-software-customizado-frontend .
            - name: Verify Docker image
              run: docker images | grep meu-software-customizado-frontend
            - name: Run Docker container
              run: |
                  docker run -d -p 8080:80 --name test-frontend meu-software-customizado-frontend
            - name: Test Docker container
              run: |
                  sleep 10
                  curl -f http://localhost:8080 || exit 1
            - name: Stop and remove Docker container
              run: |
                  docker stop test-frontend
                  docker rm test-frontend
                  docker rmi meu-software-customizado-frontend
            - name: Cleanup Docker images
              run: docker system prune -f
            - name: Confirm cleanup
              run: docker images | grep meu-software-customizado-frontend || echo "Image successfully removed"
